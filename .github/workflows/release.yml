name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            ui

      # tauri.conf's beforeBuildCommand runs `dx build`, so dioxus-cli must exist.
      # binstall fetches the prebuilt binary — building dioxus-cli from source
      # fails on current stable (swc_common/serde).
      - uses: cargo-bins/cargo-binstall@main
      - name: Install dioxus-cli
        run: cargo binstall --no-confirm --force dioxus-cli@0.7.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Tachyon ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG / the commit log for changes. macOS (Apple Silicon) build — unsigned; right-click → Open on first launch."
          releaseDraft: false
          releasePrerelease: false
