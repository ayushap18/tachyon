name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build or repair (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  frontend:
    # The prebuilt dx 0.7.9 needs GLIBC_2.39. Its WASM output is portable;
    # the native Linux app must still be compiled on the older 22.04 base.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tag matches package versions
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+(?:-[\w.-]+)?$/.test(tag)) throw new Error('Invalid release tag');
          for (const file of ['package.json', 'src-tauri/tauri.conf.json', 'src-tauri/Cargo.toml', 'ui/Cargo.toml']) {
            const text = fs.readFileSync(file, 'utf8');
            const version = file.endsWith('.json') ? JSON.parse(text).version : text.match(/^version = "([^"]+)"/m)?.[1];
            if (`v${version}` !== tag) throw new Error(`${file}: ${version} does not match ${tag}`);
          }
          JS
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm --force dioxus-cli@0.7.9
      - run: dx --version
      - run: cargo test --locked --manifest-path ui/Cargo.toml
      - run: sh ui/build-web.sh --release
      - uses: actions/upload-artifact@v4
        with:
          name: web-frontend
          path: ui/dist
          if-no-files-found: error
          retention-days: 7

  bundle:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-aarch64
            bundles: dmg
          - os: ubuntu-22.04
            platform: linux-x86_64
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev build-essential pkg-config \
            librsvg2-dev patchelf libfuse2 xdg-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-frontend
          path: ui/dist
      - name: Verify frontend was downloaded
        run: test -s ui/dist/index.html
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Package native app using the prebuilt frontend
        uses: tauri-apps/tauri-action@v0
        env:
          # Allows the AppImage-based Linux bundler tools to run without mounting FUSE.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          args: >-
            --bundles ${{ matrix.bundles }}
            --config '{"build":{"beforeBuildCommand":""}}'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Use the workflow revision's publishing helper, including for old tag repairs.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - run: npm run test:release
      - name: Verify all installers and generate checksums
        run: node scripts/release.mjs "$RELEASE_TAG" installers release-assets
      - name: Upload complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Tachyon $RELEASE_TAG" --notes-file release-assets/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.dmg release-assets/*.deb \
            release-assets/*.AppImage release-assets/SHA256SUMS --clobber
          if echo "$RELEASE_TAG" | grep -q -- '-'; then
            gh release edit "$RELEASE_TAG" --prerelease
          fi
          gh release edit "$RELEASE_TAG" --draft=false --notes-file release-assets/RELEASE_NOTES.md
          if [ "$RELEASE_EVENT" = push ] && ! echo "$RELEASE_TAG" | grep -q -- '-'; then
            gh release edit "$RELEASE_TAG" --latest
          fi
