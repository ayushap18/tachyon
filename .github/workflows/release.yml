name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # tauri.conf.json has bundle.targets = "all"; on macOS that is .app + .dmg.
          - os: macos-latest
            args: ''
          # Pinned to 22.04, not ubuntu-latest: the AppImage/.deb link against the build
          # host's glibc, so building on the oldest supported base keeps them runnable
          # on older distros.
          - os: ubuntu-22.04
            args: '--bundles appimage,deb'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Same build deps as ci.yml, plus what bundling needs: librsvg2-dev (icon loader
      # copied into the AppImage) and patchelf (linuxdeploy rewrites rpaths with it).
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev build-essential pkg-config \
            librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            ui

      # tauri.conf's beforeBuildCommand runs `dx build`, so dioxus-cli must exist.
      # binstall fetches the prebuilt binary — building dioxus-cli from source
      # fails on current stable (swc_common/serde).
      - uses: cargo-bins/cargo-binstall@main
      - name: Install dioxus-cli
        run: cargo binstall --no-confirm --force dioxus-cli@0.7.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install

      # Both matrix jobs target the same tag: the first creates the release, the second
      # finds it by tag and attaches its assets.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Tachyon ${{ github.ref_name }}"
          releaseBody: "Changes: see CHANGELOG.md. macOS (Apple Silicon): .dmg, unsigned — right-click → Open on first launch. Linux (x86_64, built on Ubuntu 22.04): .AppImage (chmod +x, then run) and .deb, unsigned. Windows is not supported yet."
          releaseDraft: false
          releasePrerelease: false
          args: ${{ matrix.args }}
