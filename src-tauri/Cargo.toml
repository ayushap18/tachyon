[package]
name = "tachyon"
version = "0.2.9"
description = "An AI-native terminal with a Rust engine and reviewed shell commands"
authors = ["Ayush"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tachyon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: without it wry gates the WKWebView drawsBackground=false path out, so
# the webview paints opaque white over the themed NSWindow backing (wry wkwebview/mod.rs).
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
# In-app update (see src/update.rs). Brings minisign-verify + tar/flate2/zip transitively;
# reqwest with rustls-tls is already here, so the AppImage stays OpenSSL-free.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
ureq = { version = "2", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# names the sync/time primitives only — tauri 2 already owns the runtime
tokio = { version = "1", features = ["sync", "time", "macros"] }
# terminal engine: owns the grid/scrollback/cursor; we feed it PTY bytes and paint the grid
vt100 = "0.16.2"
# system clipboard from Rust (webview navigator.clipboard is blocked in the Tauri webview)
arboard = "3"
# MCP server mode (mcp_server.rs): a blocking, thread-based HTTP/1.1 listener. Chosen over
# hyper (already in the tree via reqwest) because that needs the server feature plus
# hyper-util and an async accept loop; this is 4 tiny transitive crates, no TLS, no runtime.
tiny_http = "0.12"
