# tiny_http 0.12.0 (MIT OR Apache-2.0), vendored for ONE fix in src/util/task_pool.rs — see the
# comment in `TaskPool::spawn`. Upstream is unmaintained and its fork carries the same bug.
# Features, benches, examples and dev-dependencies are dropped: Tachyon serves plain HTTP on
# loopback and nothing else needs to build here. Everything else is byte-identical to the
# crates.io release; diff against it before touching anything.
[package]
edition = "2018"
name = "tiny_http"
version = "0.12.0"
authors = ["pierre.krieger1708@gmail.com", "Corey Farwell <coreyf@rwell.org>"]
description = "Low level HTTP server library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tiny-http/tiny-http"

[dependencies]
ascii = "1.0"
chunked_transfer = "1"
httpdate = "1.0.2"
log = "0.4.4"

# Upstream's own noise once its ssl features are gone; its source is not ours to tidy.
[lints.rust]
unexpected_cfgs = "allow"
dead_code = "allow"
unused_imports = "allow"
